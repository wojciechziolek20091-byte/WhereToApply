{% extends "base.html" %}
{% block title %}Health - clipbot{% endblock %}
{% block content %}
<div class="row between">
  <h2>Health checks</h2>
  {% if not online %}<a class="button ghost" href="/health?online=1">Also test the APIs (slower)</a>{% endif %}
</div>
<div class="card">
<ul class="checks big">
  {% for r in results %}
  <li class="{{ {'ok': 'ok', 'fail': 'bad', 'warn': 'warn', 'skip': 'skip'}[r.status] }}"><b>{{ r.name }}</b> {{ r.detail }}</li>
  {% endfor %}
</ul>
</div>
{% endblock %}
