<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhereToApply — Universities &amp; Bachelor's Programs</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>WhereToApply</h1>
      <p class="tagline">Explore top universities and common bachelor's degree fields to plan where to apply.</p>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="universities" role="tab" aria-selected="true">Universities</button>
    <button class="tab-btn" data-tab="bachelors" role="tab" aria-selected="false">Bachelor's Programs</button>
  </nav>

  <main class="container">
    <section id="universities" class="tab-panel active">
      <div class="controls">
        <input type="search" id="uni-search" placeholder="Search universities by name...">
        <select id="uni-country-filter">
          <option value="">All countries</option>
        </select>
      </div>
      <p class="result-count" id="uni-count"></p>
      <div class="card-grid" id="uni-list"></div>
    </section>

    <section id="bachelors" class="tab-panel">
      <div class="controls">
        <input type="search" id="deg-search" placeholder="Search bachelor's fields...">
        <select id="deg-type-filter">
          <option value="">All degree types</option>
        </select>
      </div>
      <p class="result-count" id="deg-count"></p>
      <div class="card-grid" id="deg-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>University rankings sourced from the <a href="https://www.topuniversities.com/world-university-rankings/2026" target="_blank" rel="noopener">QS World University Rankings 2026</a>.
    Bachelor's field popularity data sourced from the <a href="https://nces.ed.gov/fastfacts/display.asp?id=37" target="_blank" rel="noopener">National Center for Education Statistics</a>.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
