[project]
name = "clipbot"
version = "0.2.11"
description = "Cut rights-cleared long YouTube videos into captioned vertical clips and post them to one TikTok account."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "autotok==2.1.0",
    "av>=14,<19",
    "bgutil-ytdlp-pot-provider>=2.0.2",
    "defusedxml>=0.7.1",
    "deno>=2.9.8",
    "fastapi>=0.165.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.8.1",
    "jinja2>=3.1.6",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
    "scenedetect>=0.6",
    "structlog>=24.4",
    "typer>=0.12",
    "tzdata>=2026.6",
    "tzlocal>=5.4.5",
    "uvicorn>=0.30",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
clipbot = "clipbot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipbot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101", "S603", "S607", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
