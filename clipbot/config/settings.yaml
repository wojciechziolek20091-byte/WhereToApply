timezone: auto            # this computer's time zone, or a name like Europe/Warsaw
data_dir: data             # relative paths resolve against the working directory
dry_run: true              # renders and logs, never calls a poster
review_mode: auto          # auto | hold
whisper:
  model: large-v3-turbo    # with an NVIDIA GPU
  cpu_model: small         # without one (large models are too slow on CPU)
  device: auto             # auto | cpu | cuda
  compute_type: int8
  gpu_compute_type: float16
  beam_size: 5
llm:
  provider: openrouter
  free_only: true          # only $0 models are ever called; no paid fallback
  preferred_models:        # tried first while free; then any other free model
    - nvidia/nemotron-3.5-super-vl:free
    - openrouter/free
  min_context_tokens: 32000
  max_models_per_call: 6   # models tried per request before giving up until later
  cooldown_minutes: 15     # rest a model after a rate limit or error
discovery: {poll_minutes: 30, min_duration_sec: 180, max_duration_sec: 14400, backfill_days: 0}
rights: {allow_unlisted_cc_by: true}   # pasted links from unlisted channels: CC BY only
acquire: {timeout_minutes: 45}
clips:
  min_seconds: 20
  max_seconds: 60
  per_video: 3
  min_score: 70
  pre_roll: 0.2
  post_roll: 0.4
  blocked_risk_flags: [hate, sexual, violence, personal_data, sponsor_read,
                       copyrighted_music, medical_claim, financial_claim]
render: {width: 1080, height: 1920, fps: 30, crf: 20, preset: veryfast, loudness_lufs: -14}
captions: {words_per_line: 3, font_size: 70, hook_font_size: 74, hook_seconds: 2.5,
           bottom_margin_pct: 20, right_margin_pct: 15}
post:
  extra_hashtags: []       # your own tags on every post, e.g. [fyp]
  max_hashtags: 5
publish:
  poster: autotok          # autotok (free, unofficial) | uploadpost (official, paid)
  privacy: account_default # or PUBLIC_TO_EVERYONE, FOLLOWER_OF_CREATOR, SELF_ONLY, ...
  posts_per_day: 3         # hard ceiling 8
  min_gap_minutes: 120
  windows: ["12:00-14:00", "17:00-21:00"]
retention: {raw_days: 3, render_days: 14}
safety: {min_free_disk_gb: 5}
web:
  enabled: true            # `clipbot run` also opens the dashboard
  host: 127.0.0.1          # 0.0.0.0 to use it from your phone (needs DASHBOARD_PASSWORD)
  port: 8080
